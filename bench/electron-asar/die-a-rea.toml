# Bench fixture: an Electron .asar archive. The built-in asar rewriter strips
# embedded source-map references and injects the notice/canary, then repacks the
# archive (B-055); a non-parseable archive is copied instead of erroring (B-043).
[project]
name = "electron-asar"
version = "1.0.0"

[policy]
profile = "high"

[randomization]
enabled = false

[tarpit]
enabled = false

[[targets]]
path = "app.asar"
