# Bench fixture: a real Go binary (generated by bench/generate.sh when the Go
# toolchain is present; the case is skipped otherwise). Exercises Go detection
# and the built-in Go build-info/ID scrub.
[project]
name = "go"
version = "1.0.0"

[policy]
profile = "high"

[randomization]
enabled = false

[tarpit]
enabled = false

[[targets]]
path = "app"
