# Bench fixture: a real .NET assembly (generated by bench/generate.sh when the
# dotnet SDK is present; the case is skipped otherwise). Exercises .NET
# detection and the PE metadata strip.
[project]
name = "dotnet"
version = "1.0.0"

[policy]
profile = "high"

[randomization]
enabled = false

[tarpit]
enabled = false

[[targets]]
path = "App.dll"
