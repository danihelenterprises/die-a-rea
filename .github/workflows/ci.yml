name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Canary gauntlet
        run: cargo build && ./target/debug/die-a-rea canary-selftest
      - name: Smoke
        run: |
          cargo build
          cd /tmp
          rm -rf direa-ci && mkdir direa-ci && cd direa-ci
          printf 'var a=1;\n//# sourceMappingURL=a.js.map\n' > a.js
          "$GITHUB_WORKSPACE/target/debug/die-a-rea" init --name ci a.js
          "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist-hardened
          "$GITHUB_WORKSPACE/target/debug/die-a-rea" verify --original a.js --hardened dist-hardened/a.js --json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation invariants
        run: bash tools/docs-check.sh
      - name: Counter-heuristic self-test
        run: bash tools/docs-check.sh --self-test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f docker/Dockerfile --target runtime -t die-a-rea:runtime .
      - name: Doctor
        run: docker run --rm die-a-rea:runtime doctor
      - name: Smoke
        run: |
          tmp="$(mktemp -d)"
          printf 'var a=1;\n//# sourceMappingURL=a.js.map\n' > "$tmp/a.js"
          docker run --rm -v "$tmp":/work die-a-rea:runtime init --name ci a.js
          docker run --rm -v "$tmp":/work die-a-rea:runtime build --out dist
          docker run --rm -v "$tmp":/work die-a-rea:runtime verify --original a.js --hardened dist/a.js --json
