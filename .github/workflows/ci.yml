name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Canary gauntlet
        run: cargo build && ./target/debug/die-a-rea canary-selftest
      - name: RRS regression gate
        run: bash bench/generate.sh && ./target/debug/die-a-rea bench --check
      - name: Smoke
        run: |
          cargo build
          cd /tmp
          rm -rf direa-ci && mkdir direa-ci && cd direa-ci
          printf 'var a=1;\n//# sourceMappingURL=a.js.map\n' > a.js
          "$GITHUB_WORKSPACE/target/debug/die-a-rea" init --name ci a.js
          "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist-hardened
          "$GITHUB_WORKSPACE/target/debug/die-a-rea" verify --original a.js --hardened dist-hardened/a.js --json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation invariants
        run: bash tools/docs-check.sh
      - name: Counter-heuristic self-test
        run: bash tools/docs-check.sh --self-test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f docker/Dockerfile --target runtime -t die-a-rea:runtime .
      - name: Doctor
        run: docker run --rm die-a-rea:runtime doctor
      - name: Smoke
        run: |
          tmp="$(mktemp -d)"
          printf 'var a=1;\n//# sourceMappingURL=a.js.map\n' > "$tmp/a.js"
          docker run --rm -v "$tmp":/work die-a-rea:runtime init --name ci a.js
          docker run --rm -v "$tmp":/work die-a-rea:runtime build --out dist
          docker run --rm -v "$tmp":/work die-a-rea:runtime verify --original a.js --hardened dist/a.js --json

  adapter-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install javascript-obfuscator
        run: npm install --global javascript-obfuscator@^5
      - name: JS adapter end-to-end
        run: |
          cargo build
          tmp="$(mktemp -d)"
          printf 'function f(k){const s="SUPER_SECRET_LICENSE_MAGIC_STRING";return k===s;}\nmodule.exports={f};\n' > "$tmp/app.js"
          printf '[project]\nname="ci"\nversion="1.0.0"\n[policy]\nprofile="high"\n[randomization]\nenabled=false\n[tarpit]\nenabled=false\n[[targets]]\npath="app.js"\n' > "$tmp/die-a-rea.toml"
          out="$(cd "$tmp" && DIREA_JS_ADAPTER="$GITHUB_WORKSPACE/adapters/js/direa-js" "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist)"
          echo "$out"
          echo "$out" | grep -q "js adapter: Ok"
          (cd "$tmp" && "$GITHUB_WORKSPACE/target/debug/die-a-rea" verify --original app.js --hardened dist/app.js --json >/dev/null)

  # Optional lanes: heavier toolchains; exercise the adapters with a real tool.
  adapter-clr:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: .NET adapter smoke
        run: |
          cargo build
          tmp="$(mktemp -d)"
          dotnet new classlib -o "$tmp/lib" >/dev/null
          dotnet build "$tmp/lib" -o "$tmp/out" >/dev/null
          dll="$(find "$tmp/out" -name '*.dll' | head -1)"
          printf '[project]\nname="ci"\nversion="1.0.0"\n[policy]\nprofile="low"\n[[targets]]\npath="%s"\n' "$dll" > "$tmp/die-a-rea.toml"
          out="$(cd "$tmp" && DIREA_CLR_ADAPTER="$GITHUB_WORKSPACE/adapters/clr/direa-clr" DIREA_CLR_COMMAND="dotnet --version" "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist)"
          echo "$out"
          echo "$out" | grep -q "clr adapter: Ok"

  adapter-jvm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JVM adapter smoke
        run: |
          cargo build
          tmp="$(mktemp -d)"
          printf 'public class App { public static void main(String[] a){} }\n' > "$tmp/App.java"
          (cd "$tmp" && javac App.java && jar cf app.jar App.class)
          printf '[project]\nname="ci"\nversion="1.0.0"\n[policy]\nprofile="low"\n[[targets]]\npath="app.jar"\n' > "$tmp/die-a-rea.toml"
          out="$(cd "$tmp" && DIREA_JVM_ADAPTER="$GITHUB_WORKSPACE/adapters/jvm/direa-jvm" DIREA_JVM_COMMAND="java -version" "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist)"
          echo "$out"
          echo "$out" | grep -q "jvm adapter: Ok"

  adapter-llvm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      - name: LLVM adapter smoke
        run: |
          cargo build
          tmp="$(mktemp -d)"
          printf 'int main(void){return 0;}\n' > "$tmp/main.c"
          (cd "$tmp" && clang main.c -o app)
          printf '[project]\nname="ci"\nversion="1.0.0"\n[policy]\nprofile="low"\n[[targets]]\npath="app"\n' > "$tmp/die-a-rea.toml"
          out="$(cd "$tmp" && DIREA_LLVM_ADAPTER="$GITHUB_WORKSPACE/adapters/llvm/direa-llvm" DIREA_LLVM_BUILD="clang --version" "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist)"
          echo "$out"
          echo "$out" | grep -q "llvm adapter: Ok"

  adapter-go:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Go adapter smoke
        run: |
          go install mvdan.cc/garble@latest
          cargo build
          tmp="$(mktemp -d)"
          printf 'package main\n\nfunc main() { println("hi") }\n' > "$tmp/main.go"
          (cd "$tmp" && go mod init ci >/dev/null 2>&1 && go build -o app .)
          printf '[project]\nname="ci"\nversion="1.0.0"\n[policy]\nprofile="low"\n[[targets]]\npath="app"\n' > "$tmp/die-a-rea.toml"
          out="$(cd "$tmp" && PATH="$PATH:$(go env GOPATH)/bin" DIREA_GO_ADAPTER="$GITHUB_WORKSPACE/adapters/go/direa-go" DIREA_GO_COMMAND="garble -literals -tiny build -o {artifact} ." "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist)"
          echo "$out"
          echo "$out" | grep -q "go adapter: Ok"

  adapter-wasm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Binaryen and WABT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen wabt
      - name: WASM adapter smoke
        run: |
          cargo build
          tmp="$(mktemp -d)"
          printf '(module (func (export "add") (param i32 i32) (result i32) local.get 0 local.get 1 i32.add))\n' > "$tmp/app.wat"
          wat2wasm "$tmp/app.wat" -o "$tmp/mod.wasm"
          printf '[project]\nname="ci"\nversion="1.0.0"\n[policy]\nprofile="low"\n[[targets]]\npath="mod.wasm"\n' > "$tmp/die-a-rea.toml"
          out="$(cd "$tmp" && DIREA_WASM_ADAPTER="$GITHUB_WORKSPACE/adapters/wasm/direa-wasm" DIREA_WASM_COMMAND="wasm-opt -Oz {artifact} -o {out}" "$GITHUB_WORKSPACE/target/debug/die-a-rea" build --out dist)"
          echo "$out"
          echo "$out" | grep -q "wasm adapter: Ok"
