[workspace]
resolver = "2"
members = [
    "crates/direa-core",
    "crates/direa-cli",
    "crates/direa-verify",
    "crates/direa-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
repository = "https://github.com/danihelenterprises/die-a-rea"
homepage = "https://github.com/danihelenterprises/die-a-rea"
readme = "README.md"
keywords = ["obfuscation", "reverse-engineering", "security", "hardening"]
categories = ["development-tools", "command-line-utilities"]
authors = ["die-a-rea contributors"]
description = "Defense-in-depth hardening and measured reverse-engineering resistance against automated and LLM-driven analysis (REA and friends)."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
strip = true
