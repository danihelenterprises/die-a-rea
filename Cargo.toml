[workspace]
resolver = "2"
members = [
    "crates/direa-core",
    "crates/direa-cli",
    "crates/direa-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/die-a-rea/die-a-rea"
authors = ["die-a-rea contributors"]
description = "Defense-in-depth hardening and measured reverse-engineering resistance against automated and LLM-driven analysis (REA and friends)."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
strip = true
